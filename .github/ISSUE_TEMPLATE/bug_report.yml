name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app (apps/turboplan)
        - API server (apps/server)
        - Landing page (apps/landing-page)
        - MCP server (apps/mcp-server)
        - Research agent (apps/research-agent)
        - A feature module (tasks, documents, maps, billing, signing, ...)
        - Setup / environment / deployment
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node and pnpm versions, OS, and how you are running it (local, Docker, Cloudflare).
      value: |
        - Node:
        - pnpm:
        - OS:
        - Running via:
        - TurboPlan version (see root package.json):
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Paste relevant output. Redact secrets — never paste an AUTH_SECRET, API key or token.
      render: shell
