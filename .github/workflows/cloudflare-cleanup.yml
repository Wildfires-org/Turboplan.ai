name: Cloudflare Preview Cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to clean up"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  delete-db-branch:
    name: Delete Database Branch
    runs-on: ubuntu-latest
    environment: pr_preview

    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: pr-${{ env.PR_NUMBER }}
          api_key: ${{ secrets.NEON_API_KEY }}

  cleanup:
    name: Cleanup Preview Workers
    runs-on: ubuntu-latest
    environment: pr_preview
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Delete preview workers
        env:
          # Cloudflare credentials are scoped to the steps that call wrangler/the CF API
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/cleanup-preview.sh "${{ env.PR_NUMBER }}"

  comment:
    name: Post Cleanup Comment
    runs-on: ubuntu-latest
    needs: [delete-db-branch, cleanup]
    if: always()

    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ env.PR_NUMBER }}
          comment-author: "github-actions[bot]"
          body-includes: "## Preview Deployment"

      - name: Update comment
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Preview Deployment Cleaned Up

            The Cloudflare preview workers and database branch for this PR have been deleted.

            ---
            *Cleaned up at: ${{ github.event.pull_request.closed_at || github.run_id }}*
